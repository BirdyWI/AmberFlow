name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-win-py311.lock.txt
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -r requirements-win-py311.lock.txt
      - run: python -m pip check
      - run: python -B -m unittest discover -s tests -v
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements-win-py311.lock.txt --no-deps --disable-pip
